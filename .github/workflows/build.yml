name: Build APK

on:
  workflow_dispatch:
    inputs:
      html_code:
        description: 'HTML code'
        required: true
        type: string
      app_name:
        description: 'App name'
        required: false
        default: 'MyApp'
        type: string
      package_id:
        description: 'Package ID'
        required: false
        default: 'com.example.myapp'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Write HTML
        run: |
          mkdir -p www
          cat > www/index.html << 'HTMLEOF'
          ${{ inputs.html_code }}
          HTMLEOF

      - name: Create Cordova project
        run: |
          cordova create app ${{ inputs.package_id }} "${{ inputs.app_name }}"
          cp -r www/* app/www/
          cd app
          cordova platform add android

      - name: Build APK
        run: |
          cd app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
